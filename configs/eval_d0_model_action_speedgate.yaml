eval:
  label: d0_model_action_speedgate_closed_loop
  policy: model_action
  dataset_path: data/d0_train/carla_d0_train.h5
  checkpoint_path: outputs/d0_tiny_h3_fs5_delta_predaux_action_10k/best.pt
  output_dir: outputs/d0_eval_tiny_model_action_speedgate_200m
