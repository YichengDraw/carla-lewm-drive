run:
  name: d1_tiny_h3_fs5_auxpred_lane_perception_wide_noroute_rollout_dagger_8k
  seed: 5133
  output_dir: outputs/d1_tiny_h3_fs5_auxpred_lane_perception_wide_noroute_rollout_dagger_8k

data:
  dataset_paths:
    - data/d1_city_free_drive/carla_d1_city_free_drive_fast.h5
    - data/d1_city_free_drive_recovery_active/carla_d1_city_free_drive_recovery_active_fast.h5
    - data/d1_city_free_drive_long_recovery/carla_d1_city_free_drive_long_recovery_fast.h5
    - data/d1_city_free_drive_wide_recovery/carla_d1_city_free_drive_wide_recovery_fast.h5
    - data/d1_city_free_drive_dagger/carla_d1_city_free_drive_dagger_rollout_step1743_fast.h5
  dataset_repeat_factors: [1, 2, 2, 10, 20]
  frameskip: 5
  history_size: 3
  num_preds: 1
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  split_seed: 20260533
  image_size: 224

model:
  encoder_scale: tiny
  patch_size: 14
  embed_dim: 192
  predictor_depth: 6
  predictor_heads: 6
  predictor_mlp_dim: 768
  dropout: 0.1
  pred_weight: 0.0
  sigreg_weight: 0.0
  use_aux_head: true
  aux_weight: 1.0
  pred_aux_weight: 1.0
  aux_component_weights: [0.05, 0.0, 32.0, 32.0, 0.0, 0.0, 0.0, 0.0]
  action_weight: 0.0
  pred_action_weight: 0.0
  action_component_weights: [2.0, 16.0, 0.4]
  action_active_steer_weight: 8.0
  action_active_steer_threshold: 0.005
  action_conflict_weight: 0.0
  pred_action_conflict_weight: 0.0
  progress_mode: delta
  route_vocab_size: 0
  route_embed_scale: 0.0
  use_temporal_action_head: false
  temporal_action_include_history_actions: true

optimizer:
  lr: 5.0e-5
  weight_decay: 1.0e-3

trainer:
  max_epochs: 60
  max_steps: 8000
  batch_size: 256
  num_workers: 4
  precision: bf16
  gradient_clip_norm: 1.0
  log_every_steps: 50
  eval_every_epochs: 1
  early_stop_patience_evals: 10
  early_stop_min_steps: 1600
  early_stop_min_delta: 0.0
  batch_probe_order: [256, 192, 128, 96, 64]

wandb:
  enabled: true
  entity: yicheng132024-southern-university-of-science-technology
  project: carla-lewm-drive
  group: d1-auxpred-lane-perception-dagger
  resume: never
  mode: online
