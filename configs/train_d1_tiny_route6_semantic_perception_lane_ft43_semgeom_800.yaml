  init_checkpoint_strict: false

data:
  dataset_paths:
    - data/d1_city_free_drive_semantic/carla_d1_city_free_drive_semantic_route6_lane_teacher_fast.h5
    - data/d1_city_free_drive_semantic/carla_d1_city_free_drive_semantic_route6_wide_recovery_fast.h5
    - data/d1_city_free_drive_semantic/carla_d1_city_free_drive_semantic_ft38_lg080_failure_lane_teacher_rechunk128.h5
    - data/d1_city_free_drive_semantic/carla_d1_city_free_drive_semantic_ft38_lg2400_failure_lane_teacher_rechunk128.h5
    - data/d1_city_free_drive_semantic/carla_d1_city_free_drive_semantic_ft40_lg2400_failure_lane_teacher_rechunk128.h5
    - data/d1_city_free_drive_semantic/carla_d1_city_free_drive_semantic_ft41_lg2400_failure_tail300_lane_teacher_x2_rechunk128.h5
    - data/d1_city_free_drive_semantic/carla_d1_city_free_drive_semantic_ft41_lg080_failure_tail520_lane_teacher_x1_rechunk128.h5
  dataset_repeat_factors: [1, 20, 30, 30, 100, 180, 360]
  frameskip: 1
  history_size: 3
  num_preds: 1
  train_split: 0.60
  val_split: 0.20
  test_split: 0.20
  split_seed: 20260043
  image_size: 224

model:
  encoder_scale: tiny
  encoder_pooling: cls_mean
  patch_size: 14
  embed_dim: 192
  predictor_depth: 6
  predictor_heads: 6
  predictor_mlp_dim: 768
  dropout: 0.1
  pred_weight: 0.0
  sigreg_weight: 0.0
  use_aux_head: true
  aux_weight: 1.0
  pred_aux_weight: 0.0
  aux_component_weights: [0.0, 0.0, 256.0, 128.0, 0.0, 0.0, 0.0, 0.0]
  aux_control_weight: 4.0
  pred_aux_control_weight: 0.0
  aux_control_sign_weight: 10.0
  aux_control_active_threshold: 0.005
  aux_control_sign_balance: true
  aux_control_lane_gain: 0.8
  aux_control_heading_gain: 0.6
  aux_control_steer_limit: 0.35
  aux_lane_edge_threshold: 0.08
  aux_lane_edge_weight: 10.0
  aux_lane_underamp_weight: 20.0
  pred_aux_lane_underamp_weight: 0.0
  aux_lane_underamp_threshold: 0.04
  aux_lane_underamp_margin: 1.0
  aux_lane_underamp_balance_signs: true
  use_temporal_aux_head: true
  temporal_aux_hidden_dim: 256
  temporal_aux_dropout: 0.05
  temporal_aux_zero_init: false
  aux_lane_sign_weight: 10.0
  pred_aux_lane_sign_weight: 0.0
  aux_lane_sign_threshold: 0.04
  aux_lane_sign_balance: true
  aux_heading_sign_weight: 8.0
  pred_aux_heading_sign_weight: 0.0
  aux_heading_sign_threshold: 0.015
  aux_heading_sign_balance: true
  aux_temporal_delta_weight: 1.0
  aux_temporal_delta_lane_weight: 2.0
  aux_temporal_delta_heading_weight: 1.0
  aux_temporal_delta_active_lane_threshold: 0.06
  aux_lane_patch_mode: replace
  aux_lane_patch_pooling: attention
  aux_lane_patch_hidden_dim: 192
  aux_lane_patch_dropout: 0.1
  aux_lane_patch_zero_init: false
  use_semantic_geometry_aux_head: true
  semantic_geometry_aux_mode: replace
  semantic_geometry_rows: [96, 112, 128, 144, 160, 176, 192, 208]
  semantic_geometry_band: 5
  semantic_geometry_hidden_dim: 128
  semantic_geometry_dropout: 0.05
  semantic_geometry_zero_init: false
  action_weight: 0.0
  pred_action_weight: 0.0
  action_component_weights: [0.05, 90.0, 0.05]
  action_active_steer_weight: 16.0
  action_active_steer_threshold: 0.015
  action_conflict_weight: 0.0
  pred_action_conflict_weight: 0.0
  progress_mode: delta
  route_vocab_size: 0
  route_embed_scale: 0.0
  use_temporal_action_head: false
  temporal_action_include_history_actions: true

optimizer:
  lr: 1.0e-3
  weight_decay: 1.0e-4

trainer:
  max_epochs: 12
  max_steps: 800
  batch_size: 256
  num_workers: 4
  precision: bf16
  gradient_clip_norm: 1.0
  log_every_steps: 25
  eval_every_epochs: 1
  limit_train_batches: 240
  limit_val_batches: 80
  save_eval_checkpoints: false
  early_stop_patience_evals: 4
  early_stop_min_steps: 480
  early_stop_min_delta: 0.0
  batch_probe_order: [256, 192, 128, 96, 64]

wandb:
  enabled: true
  entity: yicheng132024-southern-university-of-science-technology
  project: carla-lewm-drive
  group: d1-route6-semantic-perception-lane-ft43-semgeom
  resume: never
  mode: online
