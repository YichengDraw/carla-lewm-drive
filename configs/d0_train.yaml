scenario:
  label: D0-train
  description: Simple single-ego training dataset on the clean Town03 spawn-3 route.
  carla_version: 0.9.16
  host: 127.0.0.1
  port: 2000
  timeout_s: 10.0
  town: Town03
  fixed_delta_seconds: 0.05
  synchronous_mode: true
  traffic_manager_port: 8000
  traffic_manager_seed: 20260522
  vehicles: 0
  walkers: 0
  weather: ClearNoon
  force_green_lights: true
  spawn_point_indices: [3]
  episodes: 80
  episode_seconds: 30.0
  target_speed_kmh: 20.0
  quality_gate:
    enabled: true
    max_attempts: 100
    min_progress_m: 160.0
    max_collision_frames: 0
    max_offroad_fraction: 0.01
    max_red_light_fraction: 0.0
    max_blocked_fraction: 0.10

camera:
  image_width: 224
  image_height: 224
  fov: 90
  transform:
    x: 1.4
    y: 0.0
    z: 1.6
    pitch: -5.0
    yaw: 0.0
    roll: 0.0

output:
  dataset_path: data/d0_train/carla_d0_train.h5
  metadata_path: data/d0_train/metadata.json
  recorder_path: data/d0_train/carla_d0_train.log
  preview_dir: data/d0_train/previews
